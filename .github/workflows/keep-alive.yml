name: Keep Render Alive

on:
  schedule:
    # Runs every 12 minutes to prevent Render from going to sleep
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Satori Health Endpoint
        run: |
          curl -sS https://satoriapi.onrender.com/api/health
