<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Satori V2</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0d12; color: #f5f7fb;
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px;
    }
    main { width: 100%; max-width: 34rem; text-align: center; }
    .mark {
      width: 68px; height: 68px; margin: 0 auto 22px; border-radius: 20px;
      display: grid; place-items: center; background: #151925;
      border: 1px solid #242b3d; color: #8aa2ff; font-weight: 700; font-size: 30px;
    }
    .eyebrow {
      margin: 0 0 8px; color: #8a93a8; font-size: 12px;
      letter-spacing: .18em; text-transform: uppercase;
    }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; }
    p { margin: 0 auto; max-width: 30rem; color: #aeb6c7; }
    button {
      margin-top: 26px; padding: 11px 20px; border-radius: 10px; border: 0;
      background: #5b7cfa; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #a9baff; outline-offset: 3px; }
    .hint { margin-top: 22px; font-size: 12px; color: #6d7689; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <p class="eyebrow">Satori V2</p>
    <h1>Brak połączenia</h1>
    <p>Ta strona nie jest jeszcze w pamięci podręcznej. Sprawdź sieć — wrócimy automatycznie, gdy połączenie wróci.</p>
    <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
    <p class="hint">Offline · No connection</p>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
