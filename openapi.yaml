openapi: 3.1.0
info:
  title: Satori V2 API
  version: 2.0.0
  description: |
    API-first judge and contest platform.

    Conventions:
    - Authentication is `Authorization: Bearer <JWT>` from `POST /api/auth/token`.
    - Errors are `{ "error": { "code", "message", "hint", "field?" } }`.
    - `limits.perLang[lang]` is an **absolute** millisecond limit, not a multiplier.
    - `POST /api/submits` accepts JSON only. Multipart upload and gist import are not supported.
    - V1 paths (`/contest/...`, `/subpage/...`) stay reachable for links embedded in
      source comments, but answer with JSON descriptors instead of browser redirects.
servers:
  - url: http://localhost:3001
security:
  - bearer: []
tags:
  - name: meta
  - name: auth
  - name: contests
  - name: problems
  - name: submits
  - name: ranking
  - name: grades
  - name: comms
  - name: integrity
  - name: webhooks
  - name: teams
  - name: orgs
  - name: account
paths:
  /api/health:
    get:
      tags: [meta]
      summary: Liveness plus judge queue depth
      security: []
  /api/status:
    get:
      tags: [meta]
      summary: Queue length, ETA estimate, language availability, missing toolchains, sandbox note
      security: []
  /api/metrics:
    get:
      tags: [meta]
      summary: Prometheus text metrics; optional SATORI_METRICS_TOKEN bearer/query gate
      security: []
  /api/metrics.json:
    get:
      tags: [meta]
      summary: JSON snapshot of the same counters, gauges and histograms
      security: []
  /api/languages:
    get:
      tags: [meta]
      summary: Language matrix (canonical keys, version, flags, hello-world, availability)
      security: []
  /api/openapi.json:
    get:
      tags: [meta]
      summary: Published OpenAPI document (JSON)
      description: Source of truth is `openapi.yaml`. The current route still serves that file as text/yaml; see docs/API.md known gaps.
      security: []
  /api/orgs:
    get:
      tags: [orgs]
      summary: List organizations with memberCount (public projection)
      security: []
    post:
      tags: [orgs]
      summary: Create an organization (superadmin)
  /api/orgs/{id}:
    get:
      tags: [orgs]
      summary: Organization summary; admins are visible only to managers
      security: []
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
    patch:
      tags: [orgs]
      summary: Edit an organization (superadmin or its org admins)
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
    delete:
      tags: [orgs]
      summary: Delete an organization (superadmin; 409 unless force with no members)
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
  /api/orgs/{id}/members:
    get:
      tags: [orgs]
      summary: List organization members (superadmin or org admins)
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [orgs]
      summary: Assign a user to the organization by login (superadmin or org admins)
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
  /api/orgs/{id}/members/{uid}:
    delete:
      tags: [orgs]
      summary: Remove a user from the organization (superadmin or org admins)
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: uid, in: path, required: true, schema: { type: integer } }
  /api/orgs/{id}/admins:
    post:
      tags: [orgs]
      summary: Add or remove an organization admin by login
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
  /api/me/orgs:
    get:
      tags: [orgs]
      summary: Organizations the caller can administer, plus the superadmin flag
  /api/search:
    get:
      tags: [meta]
      summary: Global search over contests, problems and users
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register (login 3-24 chars, email, password 6+ chars, optional accessCode)
      security: []
  /api/auth/token:
    post:
      tags: [auth]
      summary: Login -> JWT (12 h) + refresh token (14 d) + per-device session; returns a 2FA challenge when enabled
      security: []
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new JWT
      security: []
  /api/auth/revoke:
    post:
      tags: [auth]
      summary: Revoke the current session, or one session by jti
  /api/auth/forgot:
    post:
      tags: [auth]
      summary: Request a password reset; mails a link when configured, always generic (token only in dev mode)
      security: []
  /api/auth/reset:
    post:
      tags: [auth]
      summary: Complete a password reset with a single-use token and revoke sessions
      security: []
  /api/auth/2fa/setup:
    post:
      tags: [auth]
      summary: Generate a TOTP secret and otpauth URL (does not enable)
  /api/auth/2fa/enable:
    post:
      tags: [auth]
      summary: Enable TOTP after verifying a current code
  /api/auth/2fa/verify:
    post:
      tags: [auth]
      summary: Exchange a login 2FA challenge + code for tokens
      security: []
  /api/auth/2fa/disable:
    post:
      tags: [auth]
      summary: Disable TOTP with password + current code
  /api/me:
    get:
      tags: [auth]
      summary: Profile, sessions and teams
    patch:
      tags: [auth]
      summary: Update firstName, lastName, email or affiliationOrgId
  /api/me/sessions:
    get:
      tags: [auth]
      summary: List active sessions (current flag)
  /api/me/sessions/{jti}:
    delete:
      tags: [auth]
      summary: Revoke one session
      parameters:
        - { name: jti, in: path, required: true, schema: { type: string } }
  /api/me/teams:
    get:
      tags: [auth]
      summary: List teams the caller belongs to
  /api/me/password:
    post:
      tags: [auth]
      summary: Change password (revokes other sessions)
  /api/contests:
    get:
      tags: [contests]
      summary: List contests
      security: []
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [joined, pending, managed, other] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: string, enum: [yes, true, "1"] } }
    post:
      tags: [contests]
      summary: Create contest (draft; template ICPC|IOI|LABS|EXAM|PLAYGROUND|VIRTUAL)
  /api/contests/{id}:
    get:
      tags: [contests]
      summary: Get contest (public projection omits members/pending/admins and settings.exam)
      security: []
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    patch:
      tags: [contests]
      summary: Update contest (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    delete:
      tags: [contests]
      summary: Archive on first call, purge on second call (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/apply:
    post:
      tags: [contests]
      summary: Apply (open registration joins immediately, approval creates pending)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/members:
    get:
      tags: [contests]
      summary: List members and pending users (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    post:
      tags: [contests]
      summary: Add member by login with role participant|teacher|jury (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/members/approve:
    post:
      tags: [contests]
      summary: Approve or reject pending users; supports approveAllByFilter + q
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/members/csv:
    post:
      tags: [contests]
      summary: Import members from comma/newline separated logins
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/members/{uid}:
    delete:
      tags: [contests]
      summary: Remove a member or pending user (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: uid, in: path, required: true, schema: { type: string } }
  /api/contests/{id}/teams:
    get:
      tags: [teams]
      summary: List teams and rosters (contest members)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    post:
      tags: [teams]
      summary: Create a team from contest members (members/admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/teams/{tid}:
    patch:
      tags: [teams]
      summary: Rename a team or change scoreboard identity (captain/admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: tid, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [teams]
      summary: Delete a team (captain/admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: tid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/teams/{tid}/join:
    post:
      tags: [teams]
      summary: Join a team as a contest member
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: tid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/teams/{tid}/leave:
    post:
      tags: [teams]
      summary: Leave a team
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: tid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/teams/{tid}/invite:
    post:
      tags: [teams]
      summary: Invite a contest member by login (captain/admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: tid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/teams/{tid}/members/{uid}:
    delete:
      tags: [teams]
      summary: Remove a team member (captain/admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: tid, in: path, required: true, schema: { type: integer } }
        - { name: uid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/duplicate:
    post:
      tags: [contests]
      summary: Clone contest, problem sets, problems, tests, and news
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/problems:
    get:
      tags: [problems]
      summary: Problem cockpit with _best, _tries, _score, solvesPct, alias, setter, group, deadlines
      security: []
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [all, solved, todo] } }
        - { name: tag, in: query, schema: { type: string } }
    post:
      tags: [problems]
      summary: Create problem (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/ranking:
    get:
      tags: [ranking]
      summary: Scoreboard. Mode resolves from scoreboardMode or contest.mode; ?mode is accepted but ignored today.
      description: EXAM/TAKEHOME/PLAYGROUND/IOI use IOI; LABS/COURSE use LABS; ICPC/VIRTUAL/blank use ICPC. Hidden boards return 403; me-only filters rows to the caller.
      security: []
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: mode, in: query, schema: { type: string, enum: [ICPC, IOI, LABS] }, description: Reserved; currently ignored }
  /api/contests/{id}/ranking.csv:
    get:
      tags: [ranking]
      summary: Scoreboard CSV (rank, contestant, per-problem cells, total)
      security: []
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/rankings/live:
    get:
      tags: [ranking]
      summary: Live scoreboard over SSE (15 s snapshots)
      security: []
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade:
    get:
      tags: [grades]
      summary: Course grade for self, a managed student, or a teammate
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: user, in: query, schema: { type: integer } }
  /api/contests/{id}/grade/matrix:
    get:
      tags: [grades]
      summary: Full grade matrix computed by the server (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/analytics:
    get:
      tags: [grades]
      summary: Grade distribution, at-risk students, problem quality and first blood (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/preview:
    post:
      tags: [grades]
      summary: What-if grade preview (admins; no persistence)
      description: Accepts bestOfK, dropWorstN, penaltyKind, latePenalty, graceMin, capZeroAfterDays, floorPct, weights, login/student.
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/feedback:
    post:
      tags: [grades]
      summary: Send grade/verdict feedback notifications to matched students; mirrors by email when configured (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/export.csv:
    get:
      tags: [grades]
      summary: Grade CSV with login, usos_id, name, email, total, pct, grade, per-problem cells (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: scale, in: query, schema: { type: string }, description: "pct:grade pairs, e.g. 90:5,75:4,50:3,0:2" }
  /api/contests/{id}/grade.ics:
    get:
      tags: [grades]
      summary: Contest calendar (problem deadlines, start, end, freeze) as text/calendar
      security: []
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/overrides:
    post:
      tags: [grades]
      summary: Set a per-student/problem or final-grade override (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/overrides/{oid}:
    delete:
      tags: [grades]
      summary: Remove a grade override (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: oid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/grade/release:
    post:
      tags: [grades]
      summary: Release or hold grades ({released} or {at}) (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/rejudge:
    post:
      tags: [grades]
      summary: Requeue submits matching a filter (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/codes.zip:
    get:
      tags: [grades]
      summary: ZIP of every member's best/latest code per problem (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/grade/extend-selected:
    post:
      tags: [grades]
      summary: Extend deadlines for selected students (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/deadlines/bulk-extend:
    post:
      tags: [contests]
      summary: Shift start/end/freeze/default deadline and explicit problem/set deadlines by days
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/audit:
    get:
      tags: [contests]
      summary: Audit rows targeting this contest (admins; actor/action/target filters)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/clarifications:
    get:
      tags: [comms]
      summary: List clarifications with mine flag
      security: []
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    post:
      tags: [comms]
      summary: Ask a clarification (members; question + optional problem only)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/clarifications/{cid}/answer:
    post:
      tags: [comms]
      summary: Answer a clarification and notify the asker (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: cid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/clarifications/{cid}:
    delete:
      tags: [comms]
      summary: Delete a clarification (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: cid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/news:
    get:
      tags: [comms]
      summary: List announcements
      security: []
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    post:
      tags: [comms]
      summary: Create announcement (admins); email:true mirrors to eligible members when a transport is configured
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/news/{nid}:
    delete:
      tags: [comms]
      summary: Delete announcement (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: nid, in: path, required: true, schema: { type: string } }
  /api/contests/{id}/news.rss:
    get:
      tags: [comms]
      summary: RSS 2.0 feed for visible announcements
      security: []
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/news/{nid}/read:
    post:
      tags: [comms]
      summary: Mark an announcement read for the caller
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: nid, in: path, required: true, schema: { type: string } }
  /api/contests/{id}/subpages:
    get:
      tags: [comms]
      summary: List contest subpages
      security: []
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    post:
      tags: [comms]
      summary: Create subpage (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/subpages/{sid}:
    delete:
      tags: [comms]
      summary: Delete a subpage (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: sid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/integrity/similarity:
    get:
      tags: [integrity]
      summary: Similar-submission pairs (admins; threshold defaults to 0.6)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: threshold, in: query, schema: { type: number, default: 0.6 } }
  /api/contests/{id}/integrity/timeline:
    get:
      tags: [integrity]
      summary: Timeline flags for suspicious submission timing (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/integrity/appeals:
    get:
      tags: [integrity]
      summary: Open appeals (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/integrity/appeals/{aid}:
    post:
      tags: [integrity]
      summary: Resolve an appeal (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: aid, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/exam:
    get:
      tags: [integrity]
      summary: Read exam settings (members). Canonical shape { fullscreen, pasteBlock, shuffle, ipAllow, timeWindow }
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    patch:
      tags: [integrity]
      summary: Update exam settings (admins). ipAllow and timeWindow are free-text strings; client-enforced.
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/exam/violations:
    get:
      tags: [integrity]
      summary: List exam violations (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    post:
      tags: [integrity]
      summary: Record a violation for the caller (members)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/webhooks:
    get:
      tags: [webhooks]
      summary: List contest webhooks (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
    post:
      tags: [webhooks]
      summary: Register contest webhook (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/webhooks/deliveries:
    get:
      tags: [webhooks]
      summary: Last 50 delivery attempts (admins)
      parameters: [{ $ref: '#/components/parameters/ContestId' }]
  /api/contests/{id}/webhooks/{hookId}:
    delete:
      tags: [webhooks]
      summary: Delete contest webhook (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: hookId, in: path, required: true, schema: { type: integer } }
  /api/contests/{id}/webhooks/{hookId}/ping:
    post:
      tags: [webhooks]
      summary: Send a real ping with retries (admins)
      parameters:
        - { $ref: '#/components/parameters/ContestId' }
        - { name: hookId, in: path, required: true, schema: { type: integer } }
  /api/problems/{id}:
    get:
      tags: [problems]
      summary: Problem statement, limits, samples, effective deadline
      security: []
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
    patch:
      tags: [problems]
      summary: Edit problem; validator/reference/checker fields, limits versioned to limitHistory
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
    delete:
      tags: [problems]
      summary: Delete problem and its tests (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/tests:
    get:
      tags: [problems]
      summary: Test groups and cases (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
    post:
      tags: [problems]
      summary: Add a group ({group}) or a case ({case}) (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/tests/{groupId}:
    delete:
      tags: [problems]
      summary: Delete a test group by id or name (admins)
      parameters:
        - { $ref: '#/components/parameters/ProblemId' }
        - { name: groupId, in: path, required: true, schema: { type: string } }
  /api/problems/{id}/tests/groups/{gid}:
    patch:
      tags: [problems]
      summary: Update group name/points/checker/order (admins)
      parameters:
        - { $ref: '#/components/parameters/ProblemId' }
        - { name: gid, in: path, required: true, schema: { type: integer } }
  /api/problems/{id}/tests/cases/{cid}:
    patch:
      tags: [problems]
      summary: Update one test case (admins)
      parameters:
        - { $ref: '#/components/parameters/ProblemId' }
        - { name: cid, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [problems]
      summary: Delete one test case (admins)
      parameters:
        - { $ref: '#/components/parameters/ProblemId' }
        - { name: cid, in: path, required: true, schema: { type: integer } }
  /api/problems/{id}/tests/export:
    get:
      tags: [problems]
      summary: Export groups and cases as a JSON bundle (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/tests/import:
    post:
      tags: [problems]
      summary: Import a JSON group/case bundle (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/limitHistory:
    get:
      tags: [problems]
      summary: Limit change history (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/versions:
    get:
      tags: [problems]
      summary: Problem version snapshots (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/validators/run:
    post:
      tags: [problems]
      summary: Run the configured validator over every case input (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/reference/run:
    post:
      tags: [problems]
      summary: Run the reference solution over every case and report verdicts (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/reference/generate:
    post:
      tags: [problems]
      summary: Fill empty expected outputs from the reference solution (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/stress:
    post:
      tags: [problems]
      summary: Compare reference and brute programs on generated inputs (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/best:
    get:
      tags: [problems]
      summary: Caller best verdict, tries and last three submits
      security: []
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/heatmap:
    get:
      tags: [problems]
      summary: Failure counts per test (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/clone:
    post:
      tags: [problems]
      summary: Clone problem into a contest (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/rejudge:
    post:
      tags: [problems]
      summary: Requeue every submit for the problem (admins)
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/problems/{id}/submit:
    post:
      tags: [submits]
      summary: Submit to a problem without passing contestId
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
  /api/submits:
    post:
      tags: [submits]
      summary: Create submission (JSON only; code/source, filename, lang/language, contestId, problemId, teamId)
    get:
      tags: [submits]
      summary: Results table with total/limit/offset; default limit 50, max 1000; hidden/me-only board gating
      security: []
      parameters:
        - { name: contest, in: query, schema: { type: integer } }
        - { name: problem, in: query, schema: { type: integer } }
        - { name: verdict, in: query, schema: { type: string } }
        - { name: me, in: query, schema: { type: string } }
        - { name: team, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
  /api/submits/sample-run:
    post:
      tags: [submits]
      summary: Run on samples only (no score, no penalty)
  /api/submits/codes.zip:
    get:
      tags: [submits]
      summary: ZIP of the caller's own source files (max 100; 404 when none)
      parameters:
        - { name: contest, in: query, schema: { type: integer } }
        - { name: problem, in: query, schema: { type: integer } }
  /api/submits/{id}:
    get:
      tags: [submits]
      summary: Submit detail (visibility-aware; non-owners do not receive code/perTestFull)
      security: []
      parameters: [{ $ref: '#/components/parameters/SubmitId' }]
  /api/submits/{id}/events:
    get:
      tags: [submits]
      summary: SSE live verdict stream (QUE -> CMP -> TST -> verdict)
      security: []
      parameters: [{ $ref: '#/components/parameters/SubmitId' }]
  /api/submits/{id}/rejudge:
    post:
      tags: [submits]
      summary: Requeue one submit (problem managers only)
      parameters: [{ $ref: '#/components/parameters/SubmitId' }]
  /api/webhooks:
    get:
      tags: [webhooks]
      summary: List webhooks visible to the caller (contest admins see their contest hooks; superadmins see global hooks)
    post:
      tags: [webhooks]
      summary: Register a contest webhook (admins) or a global webhook (superadmin only)
  /api/notifications:
    get:
      tags: [account]
      summary: Last 50 notifications for the caller
  /api/notifications/read:
    post:
      tags: [account]
      summary: Mark notifications read ({ids} or {all:true})
  /api/notifications/prefs:
    get:
      tags: [account]
      summary: Notification preferences
    post:
      tags: [account]
      summary: Update notification preferences
  /api/notes:
    get:
      tags: [account]
      summary: List notes, optional ?problem=
      parameters:
        - { name: problem, in: query, schema: { type: integer } }
    post:
      tags: [account]
      summary: Create note ({problemId|problem, teamId?, text})
  /api/notes/{id}:
    delete:
      tags: [account]
      summary: Delete a note (owner or superadmin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
  /demo:
    get:
      tags: [meta]
      summary: Standalone demo UI
      security: []
  /:
    get:
      tags: [meta]
      summary: API landing page
      security: []
  /api:
    get:
      tags: [meta]
      summary: API landing page
      security: []
  /contest/{id}:
    get:
      tags: [meta]
      summary: V1 compatibility JSON descriptor
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
  /contest/{id}/problems:
    get:
      tags: [meta]
      summary: V1 compatibility JSON descriptor (302 when no problem id)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
  /contest/{id}/problems/{pid}:
    get:
      tags: [meta]
      summary: V1 compatibility JSON descriptor with the problem object
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: pid, in: path, required: true, schema: { type: integer } }
  /contest/{id}/ranking/{rid}:
    get:
      tags: [meta]
      summary: V1 compatibility JSON descriptor
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: rid, in: path, required: true, schema: { type: integer } }
  /contest/{id}/results:
    get:
      tags: [meta]
      summary: V1 compatibility JSON descriptor
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
  /subpage/{id}:
    get:
      tags: [meta]
      summary: V1 compatibility JSON descriptor with the subpage object
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ContestId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    OrgId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ProblemId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    SubmitId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            hint: { type: string }
            field: { type: string }
